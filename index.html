<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Event Handling & Interactive Elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="changeBtn">Click me!</button>
    <div id="imageGallery">
        <img src="image1.jpg" alt="Gallery Image" class="gallery-image">
        <img src="image2.jpg" alt="Gallery Image" class="gallery-image">
    </div>
    <form id="myForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Submit</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
